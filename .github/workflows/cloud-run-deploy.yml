name: Deploy backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'backend/cloudbuild.yaml'
      - '.github/workflows/cloud-run-deploy.yml'

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: discord-bot-507515
  REGION: asia-northeast1
  SERVICE: discord-bot-backend
  IMAGE: asia-northeast1-docker.pkg.dev/discord-bot-507515/discord-bot/backend:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Swagger
      # -------------------------

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate Swagger docs
        working-directory: backend
        run: |
          go run github.com/swaggo/swag/cmd/swag@latest init \
            -g src/cmd/main.go \
            -o docs

      - name: Commit Swagger docs if changed
        run: |
          if git diff --quiet -- backend/docs; then
            echo "No Swagger changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/docs
          git commit -m "chore: update swagger docs"
          git push origin HEAD:main

      # -------------------------
      # Google Cloud
      # -------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # -------------------------
      # Build
      # -------------------------

      - name: Build Docker image
        working-directory: ./backend
        run: |
          gcloud builds submit \
            --project="${{ env.PROJECT_ID }}" \
            --config=cloudbuild.yaml .

      # -------------------------
      # Deploy
      # -------------------------

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
