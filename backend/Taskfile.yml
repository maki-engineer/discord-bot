version: '3'

tasks:
  test-local:
    cmds:
      - cd ../discord-app && npm run migrate
      - docker compose exec -e APP_ENV=unittest backend go test {{.CLI_ARGS | default "./..."}}
    silent: true

  test-ci:
    cmds:
      - APP_ENV=unittest go test ./...
    silent: true

  lint:
    cmds:
      - golangci-lint run
      - gocyclo .
      - gocognit .
    silent: true
