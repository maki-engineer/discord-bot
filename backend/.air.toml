root = "."

[build]
  cmd = "go build -o ./tmp/main ./src/cmd/main.go"
  delay = 1000
  entrypoint = "./tmp/main"
  poll = true
  poll_interval = 1000
  exclude_dir = ["tmp", "vendor"]
  include_ext = ["go"]
  exclude_ext = ["log"]
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
